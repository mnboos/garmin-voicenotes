name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  receiver:
    name: Receiver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s server -v

  build:
    name: Compile watch app
    runs-on: ubuntu-latest
    env:
      SDK_VERSION: "^9.3.0"
      CLI_VERSION: "0.8.4"
      CLI_SHA256: 4f5710d45b287ff7cf1dc821459ebef6736dcf37b57ed2de2ec234bf94610b79
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check secrets
        env:
          DEVICES_TOKEN: ${{ secrets.DEVICES_TOKEN }}
          DEVICES_REPO: ${{ vars.DEVICES_REPO }}
          GARMIN_AGREEMENT_HASH: ${{ secrets.GARMIN_AGREEMENT_HASH }}
        run: |
          if [ -z "$DEVICES_TOKEN" ] || [ -z "$DEVICES_REPO" ] || [ -z "$GARMIN_AGREEMENT_HASH" ]; then
            echo "::error::Set the DEVICES_TOKEN and GARMIN_AGREEMENT_HASH secrets and the DEVICES_REPO variable (see docs/setup.md)."
            exit 1
          fi

      - name: Install Connect IQ SDK manager
        run: |
          deb="connect-iq-sdk-manager-cli_${CLI_VERSION}_amd64.deb"
          curl -sSfLO "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${CLI_VERSION}/${deb}"
          echo "${CLI_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ~/.Garmin/ConnectIQ/Sdks
          key: connectiq-sdk-${{ env.SDK_VERSION }}

      - name: Download SDK
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_AGREEMENT_HASH: ${{ secrets.GARMIN_AGREEMENT_HASH }}
        run: |
          connect-iq-sdk-manager agreement accept --acceptance-hash="$GARMIN_AGREEMENT_HASH"
          if [ -n "$GARMIN_USERNAME" ]; then connect-iq-sdk-manager login; fi
          connect-iq-sdk-manager sdk set "$SDK_VERSION"
          echo "CONNECTIQ_SDK=$(connect-iq-sdk-manager sdk current-path)" >> "$GITHUB_ENV"

      - name: Fetch device profiles from private repository
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DEVICES_REPO }}
          token: ${{ secrets.DEVICES_TOKEN }}
          path: .devices
          persist-credentials: false

      - name: Install device profiles
        run: |
          mkdir -p ~/.Garmin/ConnectIQ/Devices
          missing=0
          for id in $(grep -o 'product id="[^"]*"' manifest.xml | cut -d'"' -f2); do
            if [ -d ".devices/Devices/$id" ]; then cp -R ".devices/Devices/$id" ~/.Garmin/ConnectIQ/Devices/
            else echo "::error::Device profile missing in $DEVICES_REPO: Devices/$id"; missing=1; fi
          done
          rm -rf .devices
          exit $missing
        env:
          DEVICES_REPO: ${{ vars.DEVICES_REPO }}

      # A throwaway signing key is generated by build.sh; CI output is for verification only.
      - name: Compile all manifest devices
        run: bash build.sh --package

      - uses: actions/upload-artifact@v4
        with:
          name: voicenotes-${{ github.sha }}
          path: bin/Voicenotes.iq
          retention-days: 7
